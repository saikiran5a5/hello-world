name: Build and test

on:
  push:
    tags: ["v*"]
    workflow_dispatch:

env:
  ARCHIVE: hello-${{ github.ref_name }}-x86_64-unknown-linux-glibc.tar.gz

jobs:
  build:

    name: Build on ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false

      - name: Setup environment
        run: |
          uv venv --python 3.14
          uv pip install nuitka

      - name: Build the artifact
        run: |
          uv run python -m nuitka \
                  --standalone \
                  --onefile \
                  --lto=yes \
                  --enable-plugin=anti-bloat \
                  --assume-yes-for-downloads \
                  --remove-output \
                  --output-filename=hello \
                  hello.py

      - name: Test the artifact
        run: |
          chmod +x hello
          ./hello

      - name: Create archive
        run: |
          tar -czvf ${{ env.ARCHIVE }}
          sha256sum ${{ env.ARCHIVE }} > checksum.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: ./*


  create-release:
    needs: build
    name: Create a GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create * ${{ github.ref_name }} *

